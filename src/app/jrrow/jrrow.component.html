<mat-divider></mat-divider>
<div class="job-row">
  <div class="job-info">
    <div class="job-title mat-body-1"><strong>{{ title }}</strong></div>
    <div class="job-meta mat-caption">{{ date }} | {{ location }}</div>
  </div>
  <div class="job-openings mat-body-2">
    | {{ openings }} Open Positions
  </div>
  <button mat-raised-button color="primary" class="assign-button">Assign</button>
</div>
